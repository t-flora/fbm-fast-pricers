# Gating CI: builds the C++ code and runs both test suites on Ubuntu (GCC, system
# packages). Runs on pushes to main and on pull requests, so a commit on a PR branch is
# tested once (as part of the PR), not twice. macOS runs in a separate, non-gating
# workflow (ci-macos.yml). The full benchmark (~8 min) and live-data scripts are not run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install C++ dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libfftw3-dev pkg-config

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Python tests
        run: uv run --locked pytest tests/ -q
