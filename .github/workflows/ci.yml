# Builds the C++ code and runs both test suites on every push and pull request.
# Ubuntu covers GCC + system packages; macOS covers Apple Clang + Homebrew, the
# development setup. The full benchmark (~8 min) and live-data scripts are not run.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install C++ dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libfftw3-dev pkg-config

      - name: Install C++ dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen fftw pkg-config

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Python tests
        run: uv run --locked pytest tests/ -q
